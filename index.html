<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e3b2a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/recursos/icono-192.png">
<link rel="apple-touch-icon" href="/recursos/icono-192.png">
<title>Escáner de certificados</title>
<style>
  :root {
    --bosque: #0e3b2a; --bosque-claro: #1a6a3c; --hoja: #1f9d4d; --hoja-osc: #17803e;
    --lima: #c6f07a; --niebla: #edf2ec; --papel: #ffffff; --tinta: #10231a;
    --suave: #5e6f65; --linea: #d5ded6; --laser: #f0433a; --noche: #07140e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--niebla); color: var(--tinta);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--lima); outline-offset: 2px; }
  svg { display: block; }

  /* ---------- Cabecera ---------- */
  .cabecera {
    background: radial-gradient(120% 160% at 0% 0%, #2f8f45 0%, var(--bosque-claro) 32%, var(--bosque) 72%);
    color: #fff; padding: 14px 16px 30px; padding-top: calc(14px + env(safe-area-inset-top));
  }
  .cabecera-fila { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto; }
  .cabecera img { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.3)); }
  .cabecera h1 { margin: 0; font-size: 19px; line-height: 1.15; font-weight: 700; letter-spacing: -.2px; flex: 1; }
  .btn-fecha {
    display: flex; align-items: center; gap: 8px; flex: none; padding: 9px 12px; border-radius: 12px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); font-weight: 650; font-size: 14.5px;
  }
  .btn-fecha svg { width: 18px; height: 18px; }
  .btn-fecha.otro-dia { background: #fff; color: var(--bosque); border-color: #fff; }

  main { max-width: 720px; margin: -18px auto 0; padding: 0 16px 150px; }

  .otra-fecha {
    display: none; align-items: center; gap: 10px; margin-bottom: 12px; padding: 11px 14px; border-radius: 14px;
    background: #fff4f2; border: 1.5px solid var(--laser); color: #7c1d16; font-size: 14.5px;
  }
  .otra-fecha.visible { display: flex; }
  .otra-fecha span { flex: 1; }
  .otra-fecha button { font-weight: 700; color: var(--laser); padding: 6px 2px; }

  /* ---------- Hoja de trabajo ---------- */
  .papel { background: var(--papel); border-radius: 18px; padding: 16px; box-shadow: 0 10px 28px -14px rgba(14,59,42,.45); }
  .etiqueta { display: block; font-size: 13.5px; font-weight: 650; color: var(--suave); margin: 0 0 6px; }
  .campo + .campo { margin-top: 16px; }

  .selector {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 13px 14px;
    border: 1.5px solid var(--linea); border-radius: 12px; background: #fff; font-weight: 600;
  }
  .selector.vacio { color: var(--suave); font-weight: 400; }
  .selector span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selector svg { width: 18px; height: 18px; color: var(--suave); flex: none; }

  .entrada { position: relative; overflow: hidden; border-radius: 12px; }
  input[type=text], textarea {
    width: 100%; padding: 13px 14px; font: inherit; color: inherit; background: #fff;
    border: 1.5px solid var(--linea); border-radius: 12px; outline: none;
  }
  textarea { display: block; resize: none; overflow: hidden; min-height: 50px; font-weight: 600; }
  textarea::placeholder { font-weight: 400; }
  input[type=text]:focus, textarea:focus { border-color: var(--hoja); }
  .entrada.leyendo textarea { color: var(--suave); }
  .entrada.leyendo::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--laser);
    box-shadow: 0 0 14px 5px rgba(240,67,58,.45); animation: barrido-h 1.1s ease-in-out infinite alternate;
  }
  @keyframes barrido-h { from { left: 2%; } to { left: 97%; } }
  .ayuda { display: flex; align-items: baseline; gap: 10px; margin-top: 7px; font-size: 13px; color: var(--suave); }
  .ayuda span { flex: 1; }
  .ayuda button { color: var(--hoja-osc); font-weight: 700; white-space: nowrap; padding: 2px 0; }

  .hojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .hoja {
    position: relative; aspect-ratio: 210 / 297; border-radius: 8px; overflow: hidden;
    background: #fff; border: 1.5px solid var(--linea);
  }
  .hoja img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hoja .num {
    position: absolute; left: 5px; top: 5px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
    background: var(--bosque); color: #fff; font-size: 12.5px; font-weight: 700; display: grid; place-items: center;
  }
  /* El marco de escaneo del logo: es el botón para tomar una hoja */
  .marco-escaneo {
    position: relative; aspect-ratio: 210 / 297; border-radius: 12px; background: var(--bosque); color: #fff;
    display: grid; place-items: center; align-content: center; gap: 4px; font-weight: 650; font-size: 13px; text-align: center;
  }
  .marco-escaneo i {
    position: absolute; width: 22%; aspect-ratio: 1; border: 3px solid #fff; border-radius: 9px;
  }
  .marco-escaneo i:nth-child(1) { left: 9%; top: 7%; border-right: 0; border-bottom: 0; border-radius: 9px 0 0 0; }
  .marco-escaneo i:nth-child(2) { right: 9%; top: 7%; border-left: 0; border-bottom: 0; border-radius: 0 9px 0 0; }
  .marco-escaneo i:nth-child(3) { left: 9%; bottom: 7%; border-right: 0; border-top: 0; border-radius: 0 0 0 9px; }
  .marco-escaneo i:nth-child(4) { right: 9%; bottom: 7%; border-left: 0; border-top: 0; border-radius: 0 0 9px 0; }
  .marco-escaneo b { font-size: 34px; line-height: 1; font-weight: 300; color: var(--lima); }
  .hojas.sin-hojas { display: block; }
  .hojas.sin-hojas .marco-escaneo { aspect-ratio: auto; width: 100%; padding: 34px 12px; font-size: 16px; }
  .hojas.sin-hojas .marco-escaneo i { width: 26px; }
  .hojas.sin-hojas .marco-escaneo i:nth-child(1), .hojas.sin-hojas .marco-escaneo i:nth-child(3) { left: 14px; }
  .hojas.sin-hojas .marco-escaneo i:nth-child(2), .hojas.sin-hojas .marco-escaneo i:nth-child(4) { right: 14px; }
  .hojas.sin-hojas .marco-escaneo i:nth-child(1), .hojas.sin-hojas .marco-escaneo i:nth-child(2) { top: 14px; }
  .hojas.sin-hojas .marco-escaneo i:nth-child(3), .hojas.sin-hojas .marco-escaneo i:nth-child(4) { bottom: 14px; }
  .enlace { display: inline-block; margin-top: 10px; padding: 4px 0; color: var(--suave); font-size: 13.5px; text-decoration: underline; }

  /* ---------- Guardados del día ---------- */
  .titulo-seccion { margin: 26px 2px 10px; font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
  .titulo-seccion small { font-size: 13.5px; font-weight: 500; color: var(--suave); }
  .grupo { background: var(--papel); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .grupo h3 {
    margin: 0; padding: 11px 14px; font-size: 14.5px; font-weight: 700; display: flex; gap: 8px; align-items: center;
    background: #e2ecdf; color: var(--bosque);
  }
  .grupo h3 span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grupo h3 em { font-style: normal; font-weight: 600; font-size: 13px; opacity: .75; }
  .archivo {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left;
    border-top: 1px solid var(--niebla);
  }
  .archivo svg { width: 22px; height: 22px; flex: none; color: var(--hoja); }
  .archivo div { flex: 1; min-width: 0; }
  .archivo strong { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .archivo small { color: var(--suave); font-size: 13px; }
  .nada { padding: 18px 4px; color: var(--suave); font-size: 15px; }

  /* ---------- Barra inferior ---------- */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(237,242,236,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--linea);
  }
  .barra-dentro { max-width: 688px; margin: 0 auto; }
  .ruta { font-size: 12.5px; color: var(--suave); margin: 0 2px 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ruta b { color: var(--tinta); font-weight: 650; }
  .principal {
    display: block; width: 100%; padding: 15px; border-radius: 14px; background: var(--hoja);
    color: #fff; font-weight: 700; font-size: 16.5px;
  }
  .principal:active { background: var(--hoja-osc); }
  .principal[disabled] { background: #b4c2b7; }

  /* ---------- Paneles que suben desde abajo ---------- */
  .velo { position: fixed; inset: 0; z-index: 20; background: rgba(7,20,14,.55); display: none; align-items: flex-end; }
  .velo.abierta { display: flex; }
  .panel {
    width: 100%; max-width: 720px; margin: 0 auto; max-height: 86vh; display: flex; flex-direction: column;
    background: var(--papel); border-radius: 22px 22px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    animation: subir .22s ease-out;
  }
  @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-top { display: flex; align-items: center; gap: 10px; padding: 8px 0 12px; }
  .panel-top h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; }
  .redondo { width: 40px; height: 40px; border-radius: 50%; background: var(--niebla); display: grid; place-items: center; flex: none; }
  .redondo svg { width: 18px; height: 18px; }
  .lista { overflow-y: auto; margin: 10px -16px 0; padding: 0 16px; min-height: 120px; }
  .opcion {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 14px 4px;
    border-bottom: 1px solid var(--niebla); font-size: 16px;
  }
  .opcion span { flex: 1; overflow-wrap: anywhere; }
  .opcion.elegida span { font-weight: 700; color: var(--hoja-osc); }
  .opcion.nueva span { color: var(--hoja-osc); font-weight: 650; }
  .opcion .quitar { color: var(--laser); font-weight: 700; font-size: 14px; padding: 6px 8px; }
  .pie-panel { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; font-size: 14px; color: var(--suave); }
  .pie-panel button { color: var(--hoja-osc); font-weight: 700; padding: 6px 0; }

  /* Calendario */
  .mes { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
  .mes strong { flex: 1; text-align: center; font-size: 17px; text-transform: capitalize; }
  .semana, .dias { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .semana span { font-size: 12.5px; color: var(--suave); font-weight: 650; padding: 6px 0; }
  .dias button { position: relative; width: 42px; height: 42px; margin: 2px auto; border-radius: 50%; font-size: 15.5px; font-weight: 500; }
  .dias button.con-datos::after {
    content: ""; position: absolute; left: 50%; bottom: 4px; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: var(--hoja);
  }
  .dias button.hoy { box-shadow: inset 0 0 0 2px var(--hoja); font-weight: 700; }
  .dias button.elegido { background: var(--bosque); color: #fff; font-weight: 700; }
  .dias button.elegido.con-datos::after { background: var(--lima); }
  .leyenda { display: flex; align-items: center; gap: 7px; }
  .leyenda i { width: 7px; height: 7px; border-radius: 50%; background: var(--hoja); }

  /* ---------- Pantallas completas ---------- */
  .pantalla { position: fixed; inset: 0; background: var(--noche); color: #fff; display: none; flex-direction: column; z-index: 10; }
  .pantalla.abierta { display: flex; }
  .pantalla .top {
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 650;
  }
  .pantalla .top > div { min-width: 0; overflow-wrap: anywhere; }
  .pantalla .top small { display: block; font-weight: 400; opacity: .72; font-size: 13px; margin-top: 2px; }
  .pantalla .redondo { background: #1c2b23; color: #fff; }
  .escenario { flex: 1; position: relative; min-height: 0; touch-action: none; }
  .marco { position: absolute; }
  .marco img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .marco svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .marco polygon { fill: rgba(198,240,122,.14); stroke: var(--lima); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .punto { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; display: grid; place-items: center; touch-action: none; }
  .punto::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: rgba(198,240,122,.35); border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--bosque); }
  #lupa { position: absolute; top: 10px; left: 10px; width: 124px; height: 124px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,.5); display: none; z-index: 3; background: #000; }
  .controles { padding: 12px 16px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); background: #101d16; }
  .filtros { display: flex; gap: 8px; margin-bottom: 12px; }
  .filtros button { flex: 1; padding: 10px 4px; border-radius: 10px; font-size: 14px; font-weight: 650; background: #1c2b23; color: #c9d6cd; }
  .filtros button.activo { background: var(--lima); color: var(--bosque); }
  .fila { display: flex; gap: 10px; }
  .fila button { flex: 1; padding: 14px 8px; border-radius: 12px; font-weight: 700; }
  .secundario { background: #1c2b23; color: #fff; }
  .confirmar { background: var(--hoja); color: #fff; flex: 1.6 !important; }
  .peligro { background: #3a1c19; color: #ffb4ab; }
  .visor { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .visor img { display: block; width: 100%; max-width: 720px; margin: 0 auto 10px; background: #fff; border-radius: 4px; min-height: 120px; }
  #vista .visor { display: grid; place-items: center; }
  #vista .visor img { max-height: 100%; width: auto; max-width: 100%; margin: 0; }

  /* ---------- Escaneando / avisos ---------- */
  #cargando {
    position: fixed; inset: 0; z-index: 30; background: rgba(7,20,14,.82); color: #fff;
    display: none; place-items: center; align-content: center; gap: 18px; text-align: center; padding: 24px;
  }
  #cargando.abierta { display: grid; }
  .escaner { position: relative; width: 96px; height: 124px; }
  .escaner i { position: absolute; width: 26px; height: 26px; border: 4px solid #fff; }
  .escaner i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .escaner i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .escaner i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .escaner i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .escaner u {
    position: absolute; left: -10px; right: -10px; height: 3px; background: var(--laser); border-radius: 2px;
    box-shadow: 0 0 16px 5px rgba(240,67,58,.55); animation: barrido-v 1.15s ease-in-out infinite alternate;
  }
  @keyframes barrido-v { from { top: 12%; } to { top: 86%; } }
  #aviso {
    position: fixed; left: 16px; right: 16px; bottom: 124px; z-index: 40; max-width: 688px; margin: 0 auto;
    padding: 14px 16px; border-radius: 14px; background: var(--tinta); color: #fff; font-size: 14.5px;
    box-shadow: 0 10px 28px rgba(0,0,0,.3); display: none; overflow-wrap: anywhere;
  }
  #aviso.ok { background: var(--bosque); } #aviso.error { background: #a32c24; }
  #aviso b { display: block; margin-bottom: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .escaner u, .entrada.leyendo::after { animation: none; top: 50%; left: 50%; }
    .panel { animation: none; }
  }
</style>
</head>
<body>

<header class="cabecera">
  <div class="cabecera-fila">
    <img src="/recursos/logo.png" alt="">
    <h1>Escáner de certificados</h1>
    <button class="btn-fecha" id="btnFecha" aria-label="Elegir fecha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="textoFecha">Hoy</span>
    </button>
  </div>
</header>

<main>
  <div class="otra-fecha" id="otraFecha">
    <span id="textoOtraFecha"></span>
    <button id="btnVolverHoy">Volver a hoy</button>
  </div>

  <section class="papel">
    <div class="campo">
      <span class="etiqueta">Proveedor</span>
      <button class="selector vacio" id="btnProveedor">
        <span id="textoProveedor">Elegir proveedor</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="campo">
      <label class="etiqueta" for="nombre">Nombre del certificado</label>
      <div class="entrada" id="cajaNombre">
        <textarea id="nombre" rows="1" autocomplete="off" autocapitalize="characters" placeholder="Se lee del encabezado de la hoja 1"></textarea>
      </div>
      <div class="ayuda">
        <span id="ayudaNombre">Escanea la primera hoja y el nombre se completa solo.</span>
        <button id="btnLeer" hidden>Leer de nuevo</button>
      </div>
    </div>

    <div class="campo">
      <span class="etiqueta" id="etiquetaHojas">Hojas</span>
      <div class="hojas" id="hojas"></div>
      <button class="enlace" id="btnGaleria">Usar una foto de la galería</button>
    </div>
  </section>

  <h2 class="titulo-seccion"><span id="tituloDia">Guardados hoy</span><small id="cuentaDia"></small></h2>
  <div id="listaDia"></div>
</main>

<div class="barra">
  <div class="barra-dentro">
    <p class="ruta" id="ruta"></p>
    <button class="principal" id="btnPDF" disabled>Guardar PDF</button>
  </div>
</div>

<input type="file" id="camara" accept="image/*" capture="environment" hidden>
<input type="file" id="galeria" accept="image/*" hidden>

<!-- Proveedores -->
<div class="velo" id="veloProveedor">
  <div class="panel">
    <div class="panel-top">
      <h2>Proveedor</h2>
      <button class="redondo" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input type="text" id="buscarProveedor" autocomplete="off" placeholder="Buscar o escribir uno nuevo">
    <div class="lista" id="listaProveedores"></div>
    <div class="pie-panel">
      <span id="cuentaProveedores"></span>
      <button id="btnEditarLista">Quitar proveedores</button>
    </div>
  </div>
</div>

<!-- Calendario -->
<div class="velo" id="veloCalendario">
  <div class="panel">
    <div class="panel-top">
      <h2>Fecha de los certificados</h2>
      <button class="redondo" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="mes">
      <button class="redondo" id="mesAnterior" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <strong id="nombreMes"></strong>
      <button class="redondo" id="mesSiguiente" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="semana"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="dias" id="dias"></div>
    <div class="pie-panel">
      <span class="leyenda"><i></i>Días con certificados</span>
      <button id="btnHoy">Ir a hoy</button>
    </div>
  </div>
</div>

<!-- Ajuste de esquinas -->
<section class="pantalla" id="ajuste">
  <div class="top">
    <div><span id="tituloAjuste">Hoja</span><small id="notaAjuste"></small></div>
    <button class="redondo" id="btnGirar" aria-label="Girar la hoja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div class="escenario" id="escenario">
    <canvas id="lupa" width="248" height="248"></canvas>
    <div class="marco" id="marco">
      <img id="foto" alt="">
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon id="poligono"></polygon></svg>
      <div class="punto" data-i="0"></div><div class="punto" data-i="1"></div>
      <div class="punto" data-i="2"></div><div class="punto" data-i="3"></div>
    </div>
  </div>
  <div class="controles">
    <div class="filtros" id="filtros">
      <button data-f="color" class="activo">Color</button>
      <button data-f="gris">Gris</button>
      <button data-f="original">Sin retoque</button>
    </div>
    <div class="fila">
      <button class="secundario" id="btnRepetir">Repetir foto</button>
      <button class="confirmar" id="btnGuardarHoja">Guardar hoja</button>
    </div>
  </div>
</section>

<!-- Hoja en curso -->
<section class="pantalla" id="vista">
  <div class="top">
    <div id="tituloVista">Hoja</div>
    <button class="redondo" id="btnCerrarVista" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="visor"><img id="imgVista" alt=""></div>
  <div class="controles">
    <div class="fila" style="margin-bottom:10px">
      <button class="secundario" id="btnAntes">Mover antes</button>
      <button class="secundario" id="btnDespues">Mover después</button>
    </div>
    <div class="fila">

      <button class="secundario" id="btnReajustar">Reajustar esquinas</button>
    </div>

</section>

<!-- Certificado ya guardado -->
<section class="pantalla" id="guardado">
  <div class="top">
    <div><span id="tituloGuardado"></span><small id="notaGuardado"></small></div>
    <button class="redondo" id="btnCerrarGuardado" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="visor" id="hojasGuardado"></div>
</section>

<div id="cargando"><div class="escaner"><i></i><i></i><i></i><i></i><u></u></div><div id="textoCargando">Procesando…</div></div>
<div id="aviso" role="status"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const CLAVE = "escaner-certificados-v2";
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
               "septiembre", "octubre", "noviembre", "diciembre"];
const ICONO_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';

// ---------- Estado ----------
// Lo que está en curso se guarda en el celular para no perderlo si la app se recarga.
let estado = { sesion: nuevaSesion(), paginas: [], proveedor: "", nombre: "", nombreAuto: false };
let hoy = fechaLocal(new Date());   // se corrige con la fecha del servidor al conectar
let fecha = hoy;                    // fecha elegida en el calendario; al abrir la app siempre es hoy
let proveedores = [];
let motorIA = "";
let leyendo = false;
let ajuste = null, vistaIndice = -1, editandoLista = false;
let mesVisto = { anio: 0, mes: 0 };

function nuevaSesion() {
  const b = new Uint8Array(8);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}
function guardarEstado() { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} }
function leerLocal(clave, defecto) {
  try { return JSON.parse(localStorage.getItem(clave)) || defecto; } catch (e) { return defecto; }
}
function fechaLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function partesFecha(f) { const [a, m, d] = f.split("-").map(Number); return { a, m, d }; }
function fechaLarga(f) { const p = partesFecha(f); return `${p.d} de ${MESES[p.m - 1]} de ${p.a}`; }
function fechaCorta(f) { const p = partesFecha(f); return `${p.d} ${MESES[p.m - 1].slice(0, 3)}`; }
function sinTildes(texto) { return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }

// ---------- Utilidades ----------
function cargando(texto) {
  if (texto) { $("textoCargando").textContent = texto; $("cargando").classList.add("abierta"); }
  else $("cargando").classList.remove("abierta");
}
let temporizadorAviso;
function aviso(titulo, detalle, tipo, ms) {
  const caja = $("aviso");
  caja.className = tipo || "";
  caja.textContent = "";
  const b = document.createElement("b"); b.textContent = titulo; caja.appendChild(b);
  if (detalle) caja.appendChild(document.createTextNode(detalle));
  caja.style.display = "block";
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => caja.style.display = "none", ms || 5000);
}
async function api(ruta, opciones) {
  let respuesta;
  try { respuesta = await fetch(ruta, opciones); }
  catch (e) { throw new Error("No hay conexión con el servidor. Revisa el Wi-Fi y que la PC esté encendida."); }
  let datos = {};
  try { datos = await respuesta.json(); } catch (e) {}
  if (!respuesta.ok && !datos.pendiente) throw new Error(datos.error || ("Error " + respuesta.status));
  return datos;
}
const enviar = (ruta, cuerpo, metodo) => api(ruta, {
  method: metodo || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
const urlHoja = (p, extra) => `/api/pagina/${estado.sesion}/${p.id}.jpg?v=${p.v}${extra || ""}`;
function abrirVelo(id) { $(id).classList.add("abierta"); }
function cerrarVelo(id) { $(id).classList.remove("abierta"); }
document.querySelectorAll(".velo").forEach(velo => {
  velo.addEventListener("click", e => { if (e.target === velo || e.target.closest("[data-cerrar]")) velo.classList.remove("abierta"); });
});

// ---------- Pantalla principal ----------
function pintar() {
  const n = estado.paginas.length;
  const caja = $("hojas");
  caja.textContent = "";
  caja.classList.toggle("sin-hojas", n === 0);
  estado.paginas.forEach((p, i) => {
    const boton = document.createElement("button");
    boton.className = "hoja";
    boton.setAttribute("aria-label", "Ver hoja " + (i + 1));
    boton.innerHTML = `<img alt="" loading="lazy"><span class="num">${i + 1}</span>`;
    boton.querySelector("img").src = urlHoja(p, "&mini=1");
    boton.onclick = () => abrirVista(i);
    caja.appendChild(boton);
  });
  const mas = document.createElement("button");
  mas.className = "marco-escaneo"; mas.id = "btnMas";
  mas.innerHTML = `<i></i><i></i><i></i><i></i><b>+</b><span>${n ? "Otra hoja" : "Escanear la primera hoja"}</span>`;
  mas.onclick = () => $("camara").click();
  caja.appendChild(mas);

  $("etiquetaHojas").textContent = n ? "Hojas (" + n + ")" : "Hojas";
  $("textoProveedor").textContent = estado.proveedor || "Elegir proveedor";
  $("btnProveedor").classList.toggle("vacio", !estado.proveedor);
  $("btnPDF").disabled = n === 0 || leyendo;
  $("btnPDF").textContent = n ? `Guardar PDF de ${plural(n, "hoja", "hojas")}` : "Guardar PDF";
  $("btnLeer").hidden = !(motorIA && n);
  $("cajaNombre").classList.toggle("leyendo", leyendo);
  $("ayudaNombre").textContent = leyendo ? "Leyendo el encabezado de la hoja 1…"
    : estado.nombreAuto ? "Leído del encabezado. Corrígelo si alguna letra salió mal."
    : !motorIA ? "Escribe el nombre con el que se guardará el PDF."
    : n ? "Con este nombre se guardará el PDF."
    : "Escanea la primera hoja y el nombre se completa solo.";
  $("nombre").placeholder = motorIA ? "Se lee del encabezado de la hoja 1" : "Nombre del certificado";
  ajustarAltoNombre();

  const p = partesFecha(fecha);
  $("ruta").innerHTML = "";
  $("ruta").append("Se guarda en ", negrita(String(p.a)), " › ", negrita(fecha), " › ",
                   negrita(estado.proveedor || "proveedor"));
  guardarEstado();
}
function negrita(texto) { const b = document.createElement("b"); b.textContent = texto; return b; }

function pintarFecha() {
  const esHoy = fecha === hoy;
  $("textoFecha").textContent = esHoy ? "Hoy, " + fechaCorta(fecha) : fechaCorta(fecha) + " " + partesFecha(fecha).a;
  $("btnFecha").classList.toggle("otro-dia", !esHoy);
  $("otraFecha").classList.toggle("visible", !esHoy);
  $("textoOtraFecha").textContent = "Estás en el " + fechaLarga(fecha) + ". Lo que guardes irá a esa fecha.";
  $("tituloDia").textContent = esHoy ? "Guardados hoy" : "Guardados el " + fechaLarga(fecha);
}

async function cargarDia() {
  pintarFecha(); pintar();
  const lista = $("listaDia");
  try {
    const r = await api("/api/dia?fecha=" + fecha);
    if (r.fecha !== fecha) return;
    lista.textContent = "";
    $("cuentaDia").textContent = r.total ? plural(r.total, "certificado", "certificados") : "";
    if (!r.total) {
      lista.innerHTML = '<p class="nada">Todavía no hay certificados en esta fecha.</p>';
      return;
    }
    r.proveedores.forEach(prov => {
      const grupo = document.createElement("div"); grupo.className = "grupo";
      const h = document.createElement("h3");
      const nombre = document.createElement("span"); nombre.textContent = prov.nombre;
      const cuenta = document.createElement("em"); cuenta.textContent = prov.archivos.length;
      h.append(nombre, cuenta); grupo.appendChild(h);
      prov.archivos.forEach(a => {
        const fila = document.createElement("button"); fila.className = "archivo";
        fila.innerHTML = ICONO_PDF + "<div><strong></strong><small></small></div>";
        fila.querySelector("strong").textContent = a.nombre.replace(/\.pdf$/i, "");
        fila.querySelector("small").textContent = (a.hojas ? plural(a.hojas, "hoja", "hojas") + ", " : "") + a.kb + " KB";
        fila.onclick = () => abrirGuardado(prov.nombre, a);
        grupo.appendChild(fila);
      });
      lista.appendChild(grupo);
    });
  } catch (e) {
    lista.innerHTML = '<p class="nada"></p>';
    lista.firstChild.textContent = e.message;
  }
}

// ---------- Proveedores ----------
function pintarProveedores() {
  const texto = $("buscarProveedor").value.trim();
  const filtro = sinTildes(texto);
  const lista = $("listaProveedores");
  lista.textContent = "";
  const visibles = proveedores.filter(p => sinTildes(p).includes(filtro));
  visibles.forEach(p => {
    const fila = document.createElement("button");
    fila.className = "opcion" + (p === estado.proveedor ? " elegida" : "");
    const nombre = document.createElement("span"); nombre.textContent = p; fila.appendChild(nombre);
    if (editandoLista) {
      const quitar = document.createElement("span"); quitar.className = "quitar"; quitar.textContent = "Quitar";
      quitar.style.flex = "none"; fila.appendChild(quitar);
      fila.onclick = () => quitarProveedor(p);
    } else {
      fila.onclick = () => elegirProveedor(p);
    }
    lista.appendChild(fila);
  });
  if (texto && !editandoLista && !proveedores.some(p => sinTildes(p) === filtro)) {
    const fila = document.createElement("button"); fila.className = "opcion nueva";
    const nombre = document.createElement("span"); nombre.textContent = "Agregar «" + texto + "» a la lista";
    fila.appendChild(nombre);
    fila.onclick = () => agregarProveedor(texto);
    lista.appendChild(fila);
  }
  if (!lista.children.length) {
    lista.innerHTML = '<p class="nada"></p>';
    lista.firstChild.textContent = proveedores.length ? "Ningún proveedor coincide."
      : "La lista está vacía. Escribe el nombre del primer proveedor arriba para agregarlo.";
  }
  $("cuentaProveedores").textContent = plural(proveedores.length, "proveedor", "proveedores");
  $("btnEditarLista").textContent = editandoLista ? "Listo" : "Quitar proveedores";
  $("btnEditarLista").hidden = proveedores.length === 0;
}
function elegirProveedor(nombre) {
  estado.proveedor = nombre;
  cerrarVelo("veloProveedor"); pintar();
}
async function agregarProveedor(nombre) {
  try {
    const r = await enviar("/api/proveedores", { nombre });
    proveedores = r.proveedores; elegirProveedor(r.nombre);
  } catch (e) { aviso("No se pudo agregar", e.message, "error"); }
}
async function quitarProveedor(nombre) {
  if (!confirm("¿Quitar «" + nombre + "» de la lista? Los certificados ya guardados no se borran.")) return;
  try {
    const r = await enviar("/api/proveedores", { nombre }, "DELETE");
    proveedores = r.proveedores;
    if (estado.proveedor === nombre) estado.proveedor = "";
    pintarProveedores(); pintar();
  } catch (e) { aviso("No se pudo quitar", e.message, "error"); }
}
$("btnProveedor").onclick = async () => {
  editandoLista = false; $("buscarProveedor").value = "";
  pintarProveedores(); abrirVelo("veloProveedor");
  try { proveedores = (await api("/api/proveedores")).proveedores; pintarProveedores(); } catch (e) {}
};
$("buscarProveedor").oninput = pintarProveedores;
$("btnEditarLista").onclick = () => { editandoLista = !editandoLista; pintarProveedores(); };

// ---------- Calendario ----------
async function pintarCalendario() {
  const { anio, mes } = mesVisto;
  $("nombreMes").textContent = MESES[mes - 1] + " " + anio;
  const caja = $("dias");
  caja.textContent = "";
  const primero = (new Date(anio, mes - 1, 1).getDay() + 6) % 7;   // lunes = 0
  const total = new Date(anio, mes, 0).getDate();
  for (let i = 0; i < primero; i++) caja.appendChild(document.createElement("span"));
  for (let d = 1; d <= total; d++) {
    const f = `${anio}-${String(mes).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const boton = document.createElement("button");
    boton.textContent = d; boton.dataset.fecha = f;
    if (f === hoy) boton.classList.add("hoy");
    if (f === fecha) boton.classList.add("elegido");
    boton.onclick = () => elegirFecha(f);
    caja.appendChild(boton);
  }
  try {
    const r = await api(`/api/mes?anio=${anio}&mes=${mes}`);
    if (mesVisto.anio !== anio || mesVisto.mes !== mes) return;
    r.dias.forEach(f => {
      const boton = caja.querySelector(`[data-fecha="${f}"]`);
      if (boton) boton.classList.add("con-datos");
    });
  } catch (e) {}
}
function elegirFecha(f) {
  fecha = f;
  cerrarVelo("veloCalendario");
  cargarDia();
}
function moverMes(delta) {
  let { anio, mes } = mesVisto;
  mes += delta;
  if (mes < 1) { mes = 12; anio--; } else if (mes > 12) { mes = 1; anio++; }
  mesVisto = { anio, mes }; pintarCalendario();
}
$("btnFecha").onclick = () => {
  const p = partesFecha(fecha);
  mesVisto = { anio: p.a, mes: p.m };
  pintarCalendario(); abrirVelo("veloCalendario");
};
$("mesAnterior").onclick = () => moverMes(-1);
$("mesSiguiente").onclick = () => moverMes(1);
$("btnHoy").onclick = () => elegirFecha(hoy);
$("btnVolverHoy").onclick = () => elegirFecha(hoy);

// ---------- Tomar foto ----------
async function prepararFoto(archivo) {
  // Reduce a 3200 px y corrige la orientación: sube más rápido sin perder calidad de escaneo
  try {
    const mapa = await createImageBitmap(archivo, { imageOrientation: "from-image" });
    const factor = Math.min(1, 3200 / Math.max(mapa.width, mapa.height));
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.round(mapa.width * factor);
    lienzo.height = Math.round(mapa.height * factor);
    lienzo.getContext("2d").drawImage(mapa, 0, 0, lienzo.width, lienzo.height);
    const blob = await new Promise(ok => lienzo.toBlob(ok, "image/jpeg", 0.93));
    if (blob) return blob;
  } catch (e) {}
  return archivo;
}
async function recibirFoto(archivo) {
  if (!archivo) return;
  cargando("Buscando los bordes de la hoja…");
  try {
    const blob = await prepararFoto(archivo);
    const formulario = new FormData();
    formulario.append("sesion", estado.sesion);
    formulario.append("foto", blob, "foto.jpg");
    const r = await api("/api/subir", { method: "POST", body: formulario });
    abrirAjuste({
      id: r.id, esquinas: r.esquinas, filtro: leerLocal(CLAVE + "-filtro", "color"), rotar: 0,
      src: URL.createObjectURL(blob), nueva: true, detectado: r.detectado,
      numero: estado.paginas.length + 1 });
  } catch (e) {
    aviso("No se pudo subir la foto", e.message, "error", 7000);
  } finally { cargando(); }
}
$("camara").onchange = e => { recibirFoto(e.target.files[0]); e.target.value = ""; };
$("galeria").onchange = e => { recibirFoto(e.target.files[0]); e.target.value = ""; };
$("btnGaleria").onclick = () => $("galeria").click();

// ---------- Ajuste de esquinas ----------
const foto = $("foto"), marco = $("marco"), escenario = $("escenario"), lupa = $("lupa");

function abrirAjuste(datos) {
  ajuste = datos;
  $("tituloAjuste").textContent = "Hoja " + datos.numero;
  $("notaAjuste").textContent = datos.detectado === false
    ? "No encontré los bordes. Lleva cada punto a una esquina."
    : "Revisa que los puntos estén en las esquinas de la hoja.";
  document.querySelectorAll("#filtros button").forEach(b =>
    b.classList.toggle("activo", b.dataset.f === ajuste.filtro));
  foto.onload = () => { acomodarMarco(); dibujarEsquinas(); };
  foto.src = datos.src;
  $("ajuste").classList.add("abierta");
}
function cerrarAjuste() {
  $("ajuste").classList.remove("abierta");
  if (ajuste && ajuste.src.startsWith("blob:")) URL.revokeObjectURL(ajuste.src);
  ajuste = null;
}
function acomodarMarco() {
  if (!foto.naturalWidth) return;
  const margen = 30;
  const w = escenario.clientWidth - margen * 2, h = escenario.clientHeight - margen * 2;
  const factor = Math.min(w / foto.naturalWidth, h / foto.naturalHeight);
  const fw = foto.naturalWidth * factor, fh = foto.naturalHeight * factor;
  marco.style.width = fw + "px"; marco.style.height = fh + "px";
  marco.style.left = (escenario.clientWidth - fw) / 2 + "px";
  marco.style.top = (escenario.clientHeight - fh) / 2 + "px";
}
function dibujarEsquinas() {
  if (!ajuste) return;
  $("poligono").setAttribute("points",
    ajuste.esquinas.map(p => (p[0] * 1000) + "," + (p[1] * 1000)).join(" "));
  document.querySelectorAll(".punto").forEach(punto => {
    const p = ajuste.esquinas[+punto.dataset.i];
    punto.style.left = (p[0] * 100) + "%"; punto.style.top = (p[1] * 100) + "%";
  });
}
function dibujarLupa(p, clienteX) {
  const caja = marco.getBoundingClientRect();
  const ctx = lupa.getContext("2d");
  const lado = 62 * (foto.naturalWidth / caja.width);   // zona de 62 px de pantalla, ampliada 2x
  const cx = p[0] * foto.naturalWidth, cy = p[1] * foto.naturalHeight;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 248, 248);
  ctx.drawImage(foto, cx - lado / 2, cy - lado / 2, lado, lado, 0, 0, 248, 248);
  ctx.strokeStyle = "#f0433a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(124, 84); ctx.lineTo(124, 164); ctx.moveTo(84, 124); ctx.lineTo(164, 124); ctx.stroke();
  // La lupa se va al lado contrario del dedo para que no la tape
  const izquierda = clienteX > window.innerWidth / 2;
  lupa.style.left = izquierda ? "10px" : "auto";
  lupa.style.right = izquierda ? "auto" : "10px";
  lupa.style.display = "block";
}
document.querySelectorAll(".punto").forEach(punto => {
  const mover = e => {
    if (!ajuste) return;
    const caja = marco.getBoundingClientRect();
    const p = [Math.min(1, Math.max(0, (e.clientX - caja.left) / caja.width)),
               Math.min(1, Math.max(0, (e.clientY - caja.top) / caja.height))];
    ajuste.esquinas[+punto.dataset.i] = p;
    dibujarEsquinas(); dibujarLupa(p, e.clientX);
  };
  punto.addEventListener("pointerdown", e => {
    e.preventDefault(); punto.setPointerCapture(e.pointerId);
    punto.addEventListener("pointermove", mover); mover(e);
  });
  const soltar = () => { punto.removeEventListener("pointermove", mover); lupa.style.display = "none"; };
  punto.addEventListener("pointerup", soltar);
  punto.addEventListener("pointercancel", soltar);
});
window.addEventListener("resize", () => { acomodarMarco(); dibujarEsquinas(); ajustarAltoNombre(); });

$("filtros").onclick = e => {
  const f = e.target.dataset.f; if (!f || !ajuste) return;
  ajuste.filtro = f;
  try { localStorage.setItem(CLAVE + "-filtro", JSON.stringify(f)); } catch (err) {}
  document.querySelectorAll("#filtros button").forEach(b => b.classList.toggle("activo", b === e.target));
};
$("btnGirar").onclick = () => {
  if (!ajuste) return;
  ajuste.rotar = (ajuste.rotar + 90) % 360;
  aviso("Giro de " + ajuste.rotar + "°", "Se aplica al guardar la hoja.", "", 2200);
};
$("btnRepetir").onclick = () => {
  const anterior = ajuste;
  cerrarAjuste();
  if (anterior && anterior.nueva) {
    fetch(`/api/pagina/${estado.sesion}/${anterior.id}`, { method: "DELETE" }).catch(() => {});
    $("camara").click();
  }
};
$("btnGuardarHoja").onclick = async () => {
  if (!ajuste) return;
  cargando("Enderezando y limpiando la hoja…");
  let esPrimera = false;
  try {
    await enviar("/api/procesar", { sesion: estado.sesion, id: ajuste.id,
      esquinas: ajuste.esquinas, filtro: ajuste.filtro, rotar: ajuste.rotar });
    const registro = { id: ajuste.id, v: Date.now(), esquinas: ajuste.esquinas,
                       filtro: ajuste.filtro, rotar: ajuste.rotar };
    const i = estado.paginas.findIndex(p => p.id === ajuste.id);
    if (i >= 0) estado.paginas[i] = registro; else estado.paginas.push(registro);
    esPrimera = estado.paginas[0].id === registro.id;
    cerrarAjuste(); pintar();
  } catch (e) {
    aviso("No se pudo guardar la hoja", e.message, "error", 7000);
  } finally { cargando(); }
  // El nombre se lee solo de la hoja 1, y nunca pisa lo que la persona escribió a mano
  if (esPrimera && motorIA && (!estado.nombre.trim() || estado.nombreAuto)) leerNombre(false);
};

// ---------- Nombre leído del encabezado ----------
async function leerNombre(avisar) {
  if (!estado.paginas.length || leyendo) return;
  leyendo = true; pintar();
  const hoja = estado.paginas[0].id;
  try {
    const r = await enviar("/api/ia", { sesion: estado.sesion, id: hoja, proveedor: estado.proveedor });
    if (!estado.paginas.length || estado.paginas[0].id !== hoja) return;
    if (r.nombre) {
      estado.nombre = r.nombre; estado.nombreAuto = true; $("nombre").value = r.nombre;
    } else if (avisar || !estado.nombre) {
      aviso("No pude leer el encabezado", "Escribe el nombre del certificado a mano.", "", 6000);
    }
  } catch (e) {
    aviso("No se pudo leer el encabezado", e.message + " Escribe el nombre a mano.", "error", 7000);
  } finally { leyendo = false; pintar(); }
}
$("btnLeer").onclick = () => leerNombre(true);
$("nombre").oninput = e => {
  if (e.target.value.includes("\n")) e.target.value = e.target.value.replace(/\s*\n\s*/g, " ");
  estado.nombre = e.target.value; estado.nombreAuto = false; pintar();
};
function ajustarAltoNombre() {
  const caja = $("nombre");
  caja.style.height = "auto";
  caja.style.height = (caja.scrollHeight + 3) + "px";
}

// ---------- Hoja en curso ----------
function abrirVista(i) {
  vistaIndice = i;
  $("tituloVista").textContent = `Hoja ${i + 1} de ${estado.paginas.length}`;
  $("imgVista").src = urlHoja(estado.paginas[i]);
  $("btnAntes").disabled = i === 0;
  $("btnDespues").disabled = i === estado.paginas.length - 1;
  $("btnAntes").style.opacity = i === 0 ? .4 : 1;
  $("btnDespues").style.opacity = i === estado.paginas.length - 1 ? .4 : 1;
  $("vista").classList.add("abierta");
}
function cerrarVista() { $("vista").classList.remove("abierta"); vistaIndice = -1; }
function moverHoja(delta) {
  const j = vistaIndice + delta;
  if (j < 0 || j >= estado.paginas.length) return;
  const [p] = estado.paginas.splice(vistaIndice, 1);
  estado.paginas.splice(j, 0, p);
  pintar(); abrirVista(j);
}
$("btnCerrarVista").onclick = cerrarVista;
$("btnAntes").onclick = () => moverHoja(-1);
$("btnDespues").onclick = () => moverHoja(1);
$("btnEliminar").onclick = () => {
  if (!confirm("¿Eliminar esta hoja?")) return;
  const [p] = estado.paginas.splice(vistaIndice, 1);
  fetch(`/api/pagina/${estado.sesion}/${p.id}`, { method: "DELETE" }).catch(() => {});
  cerrarVista(); pintar();
};
$("btnReajustar").onclick = () => {
  const p = estado.paginas[vistaIndice], numero = vistaIndice + 1;
  cerrarVista();
  abrirAjuste({ id: p.id, esquinas: p.esquinas.map(e => e.slice()), filtro: p.filtro, rotar: p.rotar,
    src: urlHoja(p, "&original=1"), nueva: false, numero });
};

// ---------- Certificado ya guardado ----------
function abrirGuardado(proveedor, archivo) {
  $("tituloGuardado").textContent = archivo.nombre.replace(/\.pdf$/i, "");
  $("notaGuardado").textContent = proveedor + ", " + fechaLarga(fecha);
  const caja = $("hojasGuardado");
  caja.textContent = "";
  const base = `/api/guardado?fecha=${fecha}&proveedor=${encodeURIComponent(proveedor)}&archivo=${encodeURIComponent(archivo.nombre)}`;
  const total = Math.max(1, archivo.hojas);
  for (let n = 0; n < total; n++) {
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = "Hoja " + (n + 1); img.src = base + "&n=" + n;
    img.onerror = () => {
      const nota = document.createElement("p"); nota.className = "nada";
      nota.textContent = "Este PDF no se puede mostrar aquí. Ábrelo desde la PC.";
      img.replaceWith(nota);
    };
    caja.appendChild(img);
  }
  $("guardado").classList.add("abierta");
}
$("btnCerrarGuardado").onclick = () => $("guardado").classList.remove("abierta");

// ---------- Guardar el PDF ----------
$("btnPDF").onclick = async () => {
  if (!estado.paginas.length) return;
  if (!estado.proveedor) {
    aviso("Falta el proveedor", "Elige de quién es este certificado.", "", 4000);
    $("btnProveedor").click();
    return;
  }
  cargando("Guardando el PDF…");
  try {
    const r = await enviar("/api/pdf", { sesion: estado.sesion, paginas: estado.paginas.map(p => p.id),
      proveedor: estado.proveedor, nombre: estado.nombre, fecha });
    if (!r.ok) {
      aviso("El PDF no llegó a la carpeta de destino",
        "Quedó en la PC del servidor, en la carpeta _pendientes. Avisa para revisar la carpeta de destino.",
        "error", 12000);
      return;
    }
    let detalle = `${r.archivo}, en ${partesFecha(r.fecha).a} › ${r.fecha} › ${r.proveedor}`;
    if (r.errores && r.errores.length) detalle += `. No se copió a: ${r.errores.map(e => e.destino).join(", ")}`;
    aviso("PDF guardado", detalle, r.errores && r.errores.length ? "" : "ok", 8000);
    // El proveedor se conserva: lo habitual es escanear varios certificados del mismo
    estado = { sesion: nuevaSesion(), paginas: [], proveedor: estado.proveedor, nombre: "", nombreAuto: false };
    $("nombre").value = "";
    cargarDia();
  } catch (e) {
    aviso("No se pudo guardar el PDF", e.message, "error", 8000);
  } finally { cargando(); }
};

// ---------- Arranque ----------
(async function iniciar() {
  const previo = leerLocal(CLAVE, null);
  if (previo && previo.sesion && Array.isArray(previo.paginas)) estado = Object.assign(estado, previo);
  $("nombre").value = estado.nombre || "";
  pintarFecha(); pintar();
  try {
    const config = await api("/api/config");
    motorIA = config.ia; hoy = config.hoy; fecha = hoy;
    proveedores = (await api("/api/proveedores")).proveedores;
    if (estado.paginas.length) {
      const r = await api("/api/sesion/" + estado.sesion);
      estado.paginas = estado.paginas.filter(p => r.paginas.includes(p.id));
    }
    await cargarDia();
  } catch (e) {
    $("listaDia").innerHTML = '<p class="nada">Sin conexión con el servidor.</p>';
    aviso("Sin conexión", e.message, "error", 8000);
  }
})();
</script>
</body>
